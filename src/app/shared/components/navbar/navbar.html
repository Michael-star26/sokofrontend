<header class="navbar-header">
  <div class="navbar-container">
    <!-- Logo -->
    <a routerLink="/products" class="brand-logo">
      <span nz-icon nzType="shopping-cart" class="brand-icon"></span>
      <span class="brand-name">SokoCommerce</span>
    </a>

    <!-- Desktop Navigation -->
    <div class="desktop-menu">
      <a routerLink="/products" routerLinkActive="active-link" class="nav-link">
        <span nz-icon nzType="appstore"></span>
        <span>Products</span>
      </a>

      @if (auth.isAdmin()) {
        <a routerLink="/products/add" routerLinkActive="active-link" class="nav-link">
          <span nz-icon nzType="plus-circle"></span>
          <span>Add Product</span>
        </a>
        <a routerLink="/admin/users" routerLinkActive="active-link" class="nav-link">
          <span nz-icon nzType="team"></span>
          <span>Manage Users</span>
        </a>
      }
    </div>

    <!-- Actions & Cart Badge -->
    <div class="desktop-actions nav-actions flex items-center gap-4">

      <!-- Cart Icon with Badge -->
      <a routerLink="/cart" class="nav-link relative flex items-center">
        <nz-badge [nzCount]="cartCount()" [nzOverflowCount]="99" [nzShowZero]="false">
          <button nz-button nzType="text" class="flex items-center justify-center p-1">
            <span nz-icon nzType="shopping-cart" class="text-xl"></span>
          </button>
        </nz-badge>
      </a>

      @if (auth.isAuthenticated()) {
        <div class="user-status">
          <span class="role-badge" [class.admin]="auth.isAdmin()" [class.user]="!auth.isAdmin()">
            {{ auth.isAdmin() ? 'Admin' : 'User' }}
          </span>
        </div>

        <button nz-button nzType="default" nzDanger (click)="logout()">
          <span nz-icon nzType="logout"></span>
          Logout
        </button>
      } @else {
        <a routerLink="/auth/login" nz-button nzType="link">Login</a>
        <a routerLink="/auth/register" nz-button nzType="primary">Register</a>
      }
    </div>

    <!-- Mobile Button -->
    <button type="button" class="mobile-toggle-btn" (click)="isMobileMenuOpen = true">
      <span nz-icon nzType="menu"></span>
    </button>
  </div>
</header>

@if (isMobileMenuOpen) {
  <nz-drawer
    [nzVisible]="isMobileMenuOpen"
    nzPlacement="right"
    nzTitle="Menu"
    (nzOnClose)="isMobileMenuOpen = false">
    <ng-container *nzDrawerContent>
      <div class="mobile-drawer-content flex flex-col gap-4">
        <div class="mobile-nav-links flex flex-col gap-3">
          <a routerLink="/products" class="mobile-link flex items-center gap-2 text-base" (click)="isMobileMenuOpen = false">
            <span nz-icon nzType="appstore"></span>
            <span>Products</span>
          </a>

          <!-- Mobile Cart Link -->
          <a routerLink="/cart" class="mobile-link flex items-center justify-between text-base" (click)="isMobileMenuOpen = false">
            <div class="flex items-center gap-2">
              <span nz-icon nzType="shopping-cart"></span>
              <span>Cart</span>
            </div>
            <nz-badge [nzCount]="cartCount()" [nzOverflowCount]="99"></nz-badge>
          </a>

          @if (auth.isAdmin()) {
            <a routerLink="/products/add" class="mobile-link flex items-center gap-2 text-base" (click)="isMobileMenuOpen = false">
              <span nz-icon nzType="plus-circle"></span>
              <span>Add Product</span>
            </a>
            <a routerLink="/admin/users" class="mobile-link flex items-center gap-2 text-base" (click)="isMobileMenuOpen = false">
              <span nz-icon nzType="team"></span>
              <span>Manage Users</span>
            </a>
          }
        </div>
      </div>
    </ng-container>
  </nz-drawer>
}
