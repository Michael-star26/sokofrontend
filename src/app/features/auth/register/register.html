<form nz-form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

  <!-- Username Field -->
  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="username">Username</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please enter a valid username (at least 3 characters)">
      <nz-input-group nzPrefixIcon="user">
        <input type="text" nz-input formControlName="username" id="username" placeholder="Username" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>

  <!-- Email Field -->
  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="email">E-mail</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please enter a valid e-mail address">
      <nz-input-group nzPrefixIcon="mail">
        <input type="email" nz-input formControlName="email" id="email" placeholder="Email Address" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>

  <!-- Phone Field -->
  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="phone">Phone</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please enter a valid phone number">
      <nz-input-group nzPrefixIcon="phone">
        <input type="tel" nz-input formControlName="phone" id="phone" placeholder="Phone number" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>

  <!-- Password Field -->
  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="password">Password</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Password must be at least 6 characters">
      <nz-input-group nzPrefixIcon="lock">
        <input type="password" nz-input formControlName="password" id="password" placeholder="Password" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>

  <!-- Submit Button -->
  <nz-form-item>
    <nz-form-control [nzSpan]="14" [nzOffset]="6">
      <button nz-button nzType="primary" [nzLoading]="isLoading" [disabled]="registerForm.invalid">
        Register
      </button>
    </nz-form-control>
  </nz-form-item>

</form>
