<div class="duo-auth-container">
  <div class="uo-card duo-auth-card">

    <div class="duo-auth-header">
      <h2 class="duo-auth-title">Create Account</h2>
      <p class="duo-auth-subtitle">Join us! Enter your details to get started.</p>
    </div>

    <form nz-form [formGroup]="registerForm" (ngSubmit)="onSubmit()" nzLayout="vertical">

      <!-- Username Field -->
      <nz-form-item>
        <nz-form-label nzRequired>Username</nz-form-label>
        <nz-form-control nzErrorTip="Please enter a valid username (at least 3 characters)">
          <nz-input-group nzPrefixIcon="user">
            <input type="text" nz-input formControlName="username" placeholder="Username" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Email Field -->
      <nz-form-item>
        <nz-form-label nzRequired>E-mail</nz-form-label>
        <nz-form-control nzErrorTip="Please enter a valid e-mail address">
          <nz-input-group nzPrefixIcon="mail">
            <input type="email" nz-input formControlName="email" placeholder="Email Address" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Phone Field -->
      <nz-form-item>
        <nz-form-label nzRequired>Phone</nz-form-label>
        <nz-form-control nzErrorTip="Please enter a valid phone number">
          <nz-input-group nzPrefixIcon="phone">
            <input type="tel" nz-input formControlName="phone" placeholder="Phone number" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Password Field -->
      <nz-form-item>
        <nz-form-label nzRequired>Password</nz-form-label>
        <nz-form-control nzErrorTip="Password must be at least 6 characters">
          <nz-input-group nzPrefixIcon="lock">
            <input type="password" nz-input formControlName="password" placeholder="Password" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Submit Button -->
      <button type="submit" class="uo-button-primary duo-submit-btn" [disabled]="registerForm.invalid || isLoading">
        @if (isLoading) {
          <nz-spin nzSimple></nz-spin>
        } @else {
          Register
        }
      </button>

    </form>

    <!-- Footer Link -->
    <div class="duo-auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/auth/login" class="duo-link">Log in</a>
    </div>

  </div>
</div>
