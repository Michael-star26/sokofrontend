<div class="duo-page-container">

  <!-- Navigation Header -->
  <div class="duo-nav-bar">
    <a routerLink="/products" class="uo-button-secondary duo-back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Market
    </a>

    <!-- Stamina Badge -->
    <div class="uo-badge-gold">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#ffc800">
        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
      </svg>
      <span>99/100</span>
    </div>
  </div>

  @if (product(); as prod) {
    <!-- Side-by-Side Flex Layout -->
    <div class="duo-product-layout">

      <!-- TOP LEFT: Square Image Card -->
      <div class="duo-image-card">
        <span class="duo-category-badge">{{ prod.category }}</span>
        <img
          [src]="prod.image_url || 'https://via.placeholder.com/150'"
          [alt]="prod.name"
          class="duo-product-image"
        />
      </div>

      <!-- RIGHT SIDE: Info & Action Card -->
      <div class="duo-details-card">
        <div class="duo-header-info">
          <h1 class="duo-title">{{ prod.name }}</h1>

          <div class="duo-price-row">
            <span class="duo-gem-price">KSh {{ prod.cost }}</span>
            <span class="duo-stock-status">In Stock</span>
          </div>
        </div>

        <p class="duo-description">
          {{ prod.description || 'Fresh item ready for collection.' }}
        </p>

        <div class="duo-actions">
          <button type="button" class="uo-button-primary" (click)="openCheckoutModal()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
            Collect Item
          </button>

          @if (isAdmin()) {
            <button
              type="button"
              nz-popconfirm
              nzPopconfirmTitle="Remove product?"
              (nzOnConfirm)="deleteProduct(prod.id!)"
              class="uo-button-danger">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
              </svg>
              Delete Item
            </button>
          }
        </div>
      </div>

    </div>

    <!-- M-Pesa Guest Express Checkout Modal -->
    <nz-modal
      [nzVisible]="isCheckoutVisible()"
      nzTitle="M-Pesa Express Checkout"
      [nzFooter]="null"
      (nzOnCancel)="closeCheckoutModal()">
      <ng-container *nzModalContent>
        <div style="display: flex; flex-direction: column; gap: 16px; padding-top: 8px;">

          <div style="display: flex; justify-content: space-between; padding: 12px; background: #f0fdf4; border-radius: 12px; border: 1.5px solid #bbf7d0;">
            <span>Item Payload:</span>
            <strong>KSh {{ prod.cost }}</strong>
          </div>

          <!-- Guest Name Input -->
          <div>
            <label style="font-weight: 700; color: #374151; display: block; margin-bottom: 6px;">Full Name</label>
            <input
              nz-input
              type="text"
              placeholder="e.g. Alex Otieno"
              [ngModel]="guestName()"
              (ngModelChange)="guestName.set($event)"
              [disabled]="isProcessing()" />
          </div>

          <!-- M-Pesa Phone Number Input -->
          <div>
            <label style="font-weight: 700; color: #374151; display: block; margin-bottom: 6px;">M-Pesa Phone Number</label>
            <nz-input-group nzPrefix="🇰🇪">
              <input
                nz-input
                type="text"
                placeholder="07XXXXXXXX or 2547XXXXXXXX"
                [ngModel]="phoneNumber()"
                (ngModelChange)="phoneNumber.set($event)"
                [disabled]="isProcessing()" />
            </nz-input-group>
          </div>

          @if (isProcessing()) {
            <div style="display: flex; align-items: center; gap: 10px; padding: 10px; background: #eff6ff; border-radius: 8px; color: #1d4ed8; font-weight: 600;">
              <nz-spin nzSimple></nz-spin>
              <span>{{ statusText() }}</span>
            </div>
          }

          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">
            <button
              type="button"
              class="uo-button-secondary"
              (click)="closeCheckoutModal()"
              [disabled]="isProcessing()">
              Cancel
            </button>
            <button
              type="button"
              class="uo-button-primary"
              (click)="processCheckout(prod.cost)"
              [disabled]="isProcessing()">
              Pay KSh {{ prod.cost }}
            </button>
          </div>

        </div>
      </ng-container>
    </nz-modal>

  } @else {
    <div class="duo-loading">
      <nz-spin nzSimple></nz-spin>
      <p style="margin-top: 8px;">Loading Item...</p>
    </div>
  }
</div>
